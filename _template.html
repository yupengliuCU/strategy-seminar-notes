<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — 深度解读</title>
<style>
:root{--text:#1a1a1a;--bg:#fafaf8;--accent:#2563eb;--muted:#6b7280;--border:#e5e7eb;--code-bg:#f3f4f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Serif SC",serif;color:var(--text);background:var(--bg);line-height:1.85;padding:2.5rem 1.5rem;max-width:760px;margin:0 auto;font-size:17px}
h1{font-size:1.9rem;margin:0 0 .3rem;line-height:1.3}
h2{font-size:1.3rem;margin:2.8rem 0 .8rem;color:var(--accent);padding-bottom:.4rem;border-bottom:1px solid var(--border)}
h3{font-size:1.1rem;margin:1.5rem 0 .5rem;color:#333}
.meta{color:var(--muted);font-size:.9rem;margin-bottom:2.5rem;line-height:1.8}
.meta a{color:var(--accent);text-decoration:none}
blockquote{border-left:3px solid var(--accent);padding:.6rem 1.2rem;margin:1.5rem 0;background:#f0f4ff;border-radius:0 8px 8px 0}
pre{background:var(--code-bg);padding:1rem 1.2rem;border-radius:8px;overflow-x:auto;font-size:.85rem;line-height:1.5;margin:1.5rem 0;border:1px solid var(--border)}
code{font-family:"SF Mono","Fira Code",monospace;font-size:.9em}
p{margin:1rem 0}
strong{color:#111}
ul,ol{margin:1rem 0 1rem 1.5rem}
li{margin:.4rem 0}
table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.93rem}
td,th{border:1px solid var(--border);padding:.6rem .9rem;text-align:left;vertical-align:top}
th{background:#f9fafb;font-weight:600}
.summary-box{background:linear-gradient(135deg,#f0f4ff,#faf5ff);padding:1.5rem;border-radius:12px;margin:1.5rem 0}
.summary-box h3{margin:0 0 .5rem;color:var(--accent)}
.golden{font-size:1.2rem;font-weight:600;color:var(--accent);text-align:center;padding:2rem 1rem;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);margin:2.5rem 0;line-height:1.6}
.note{background:#fff8e6;border:1px solid #f0e0b0;border-radius:8px;padding:.8rem 1rem;margin:1.2rem 0;font-size:.9rem}
.back{margin:3rem 0 1rem;font-size:.9rem}
.back a{color:var(--accent);text-decoration:none}
@media(max-width:600px){body{font-size:16px;padding:1.2rem 1rem}h1{font-size:1.5rem}}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>mermaid.initialize({startOnLoad:true,theme:'default',securityLevel:'loose'});</script>
</head>

<!-- ============ 内容区（替换 {{CONTENT}}）============
结构要求（academic 风格，≥4000 中文字）：
1. <h1>论文标题</h1> + .meta 元信息（作者/期刊/年份/DOI/性质/代码状态）
2. .summary-box：一句话总结（100 字内）
3. .note 阅读提示（可选：本文对课程的意义 / 工具适配说明）
4. <h2> 分节：背景与动机 → 核心概念/论证逐节展开 → 证据 → 局限（作者自述 + 独立判断）→ 结论
5. ≥2 张对比表（成对概念 / 分类框架，表头中英并置）
6. ≥1 个 Mermaid 图（论证结构或框架）
7. blockquote 引用原文（保持英文，后跟中文复述），标注 Figure/页码
8. .golden 结尾金句
9. .note AI 辅助说明

双语术语规范（必须）：
- 关键术语首次出现 = 中文（English）并置，如 运营效益（operational effectiveness, OE）
- 核心概念中英交替出现，保持英文可检索
- 表格表头中英并置
- 引用原文保持英文原样

写作风格：直接、肯定、面向问题；避免 AI 套话（"深入探讨""至关重要""值得注意的是"）；避免预设反驳式句法（"不是……而是……"）
============ -->
